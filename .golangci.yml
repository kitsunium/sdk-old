version: "2"

# Linters configuration with detailed explanations
linters:
  enable:
    # Code correctness - These catch real bugs
    - bodyclose # Ensures HTTP response body is closed properly
    - errorlint # Ensures errors are properly wrapped and compared
    - govet # Reports suspicious constructs
    - ineffassign # Detects when assignments have no effect
    - staticcheck # Comprehensive static analysis tool
    - sqlclosecheck # Ensures SQL rows and statements are closed

    # Code style - Improves readability
    - dogsled # Checks for too many blank identifiers (e.g., _, _, _, x := ...)
    - godot # Ensures comments end with a period
    - lll # Reports lines longer than 120 characters
    - misspell # Finds commonly misspelled English words

    # Code complexity - Helps maintain code quality
    - gocyclo # Reports functions with high cyclomatic complexity
    - gocritic # Provides opinionated code style checks

    # Performance - Identifies optimization opportunities
    - prealloc # Suggests preallocating slices when size is known

    # Error handling - Ensures proper error handling patterns
    - wrapcheck # Ensures errors from external packages are wrapped

  disable:
    - errcheck # Too noisy, covered by staticcheck
    - gosec # Security checks - enable when doing security audit
    - revive # Alternative to golint, too strict for regular use

# Runtime configuration
run:
  tests: true # Include test files in analysis
  timeout: 5m # Maximum time to wait for analysis
  go: "1.23" # Go version for module operations

# Issues handling configuration
issues:
  max-issues-per-linter: 0 # Show all issues (0 = unlimited)
  max-same-issues: 0 # Show all occurrences of same issue

  # New issues configuration for CI
  new: false # Don't show only new issues
  fix: false # Don't auto-fix issues
