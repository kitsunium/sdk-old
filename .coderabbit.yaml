# CodeRabbit configuration for Kitsunium SDK
# Docs: https://docs.coderabbit.ai/

language: en-US
tone_instructions: |
  Be concise. Focus on correctness, performance, and layer-hierarchy violations.
  Do not suggest stylistic changes that conflict with ktn-linter rules.

early_access: false
enable_free_tier: true

reviews:
  profile: assertive
  request_changes_workflow: true
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main
  path_filters:
    - "!**/BUILD.bazel"
    - "!**/*.generated.go"
    - "!**/testdata/**"
    - "!vendor/**"
    - "!scripts/**"
    - "!docs/**"

  path_instructions:
    - path: "pkg/kernel/**/*.go"
      instructions: |
        This is the KERNEL layer. CRITICAL rules:
        1. May import ONLY Go stdlib — NO internal imports, NO third-party deps.
        2. Every file must have benchmarks for hot paths (`*_bench_test.go`).
        3. Reject any PR that adds a non-stdlib import in kernel.
        4. Reject reverse dependencies (kernel importing core/component).
        5. Performance-critical: flag any allocation in hot paths.
        6. Prefer atomic primitives over mutex where possible.

    - path: "pkg/core/**/*.go"
      instructions: |
        This is the CORE layer. CRITICAL rules:
        1. May import ONLY kernel packages — NO stdlib directly (use kernel wrappers).
        2. NO third-party deps except those listed in go.mod for config parsing.
        3. Reject any PR that imports from pkg/component/*.

    - path: "pkg/component/**/*.go"
      instructions: |
        This is the COMPONENT layer. Rules:
        1. May import core/ and kernel/ only.
        2. Must follow `package.Thing(...)` naming (e.g., `logger.JSON()`).
        3. Constructors MUST NOT use `New` prefix.
        4. Variants via functional options, not separate constructors.

    - path: "**/*_test.go"
      instructions: |
        Use stdlib `testing` only — NO testify, NO gocheck.
        Prefer table-driven tests.
        Reject mocks generated by mockery/gomock — use hand-written fakes.

chat:
  auto_reply: true

knowledge_base:
  learnings:
    scope: auto
  issues:
    scope: auto
