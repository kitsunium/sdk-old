# CodeRabbit configuration for Kitsunium SDK
# Docs: https://docs.coderabbit.ai/
#
# Paths updated for the v1/ multi-module monorepo layout (see CLAUDE.md §2).

language: en-US
tone_instructions: |
  Be concise. Focus on correctness, performance, and layer-hierarchy
  violations. Do not suggest stylistic changes that conflict with
  ktn-linter rules (.ktn-linter.yaml, 148 rules, 8 phases).

early_access: false
enable_free_tier: true

reviews:
  profile: assertive
  request_changes_workflow: true
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main
  path_filters:
    - "!**/BUILD.bazel"
    - "!**/*.generated.go"
    - "!**/testdata/**"
    - "!**/vendor/**"
    - "!scripts/**"
    - "!docs/**"
    - "!bazel-*/**"

  path_instructions:
    - path: "v1/internal/kernel/**/*.go"
      instructions: |
        This is the KERNEL layer (v1). Linux-only, syscall-near, stateless.
        CRITICAL rules:
        1. May import ONLY Go stdlib — NO internal imports, NO third-party.
        2. Every file must carry `//go:build linux`.
        3. Hot paths require `*_bench_test.go` with 0-alloc steady-state.
        4. Reject reverse dependencies (kernel importing core/component).
        5. Reject any state-holding primitive — state belongs in core.
        6. Prefer atomic primitives over mutex where possible.

    - path: "v1/internal/core/**/*.go"
      instructions: |
        This is the CORE layer (v1). Stateful, generic, reusable.
        CRITICAL rules:
        1. May import `internal/kernel/*`, stdlib, vetted 3rd-party.
        2. MUST NOT import `components/`, `adapters/`, `ports/`.
        3. State is explicit — every stateful type exposes lifecycle
           (Close/Flush) when it owns goroutines or timers.
        4. Hot paths require benchmarks.
        5. A core primitive must be reusable by at least two components
           (or plausibly so) — otherwise it belongs inside the component.

    - path: "v1/ports/**/*.go"
      instructions: |
        This is the PORTS layer (v1). Interface contracts only.
        CRITICAL rules:
        1. Go stdlib only. NO internal/* imports (except re-exports from
           ports/common for ergonomics).
        2. NO logic — types, enums, interfaces.
        3. Changing a port method is a wire-level breaking change;
           gate behind a new vN/ scaffold.

    - path: "v1/components/**/*.go"
      instructions: |
        This is the COMPONENTS layer (v1). Public products.
        CRITICAL rules:
        1. May import `ports/*`, `internal/*`, stdlib, 3rd-party.
        2. MUST NOT import `adapters/*` — components declare ports,
           adapters satisfy them.
        3. Follow `package.Thing(...)` naming (e.g., `logger.JSON()`).
        4. Constructors MUST NOT use `New*` prefix.
        5. Variants via functional options, not separate constructors.
        6. No global state. No package-level init touching I/O.

    - path: "v1/adapters/**/*.go"
      instructions: |
        This is the ADAPTERS layer (v1). Driver implementations.
        CRITICAL rules:
        1. May import `ports/*`, `internal/*`, stdlib, 3rd-party.
        2. MUST NOT import `components/*`.
        3. One adapter = one backend. Never branch on env vars to
           pick behaviour.
        4. Lifecycle (`Open/Close/Flush`) must be idempotent and
           context-aware.
        5. Errors via the adapter package's own `errs.Define` catalog.

    - path: "**/*_test.go"
      instructions: |
        Stdlib `testing` + `testify/require` are allowed (testify is
        already in go.mod). Prefer table-driven tests. Reject mocks
        generated by mockery/gomock — use hand-written fakes against
        the `ports/*` interfaces.

chat:
  auto_reply: true

knowledge_base:
  learnings:
    scope: auto
  issues:
    scope: auto
