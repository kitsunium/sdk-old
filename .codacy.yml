---
# Codacy Configuration File
# This configuration is used by:
# - Codacy cloud platform (automatically detected)
# - GitHub Actions workflow (CI/CD)
# - Local analysis via Makefile

# Analysis engines for Go
engines:
  # Go static analysis tools
  gosec:
    enabled: true
  revive:
    enabled: true
  staticcheck:
    enabled: true
  golint:
    enabled: true
  gofmt:
    enabled: true
  govet:
    enabled: true
  ineffassign:
    enabled: true
  structcheck:
    enabled: true
  varcheck:
    enabled: true
  aligncheck:
    enabled: true
  deadcode:
    enabled: true
  duplication:
    enabled: true
    config:
      languages:
        - go
        - shell
      min_tokens: 40
      min_lines: 5
      exclude_paths:
        - "**/*_test.go"
        - "*_test.go"
  metrics:
    enabled: true
  coverage:
    enabled: true

# Files to exclude from analysis
exclude_paths:
  # Test files - no need to analyze
  - "**/*_test.go"
  - "*_test.go"
  - "**/testdata/**"
  - "**/*_bench_test.go"
  - "**/*_benchmark_test.go"
  - "**/test/**"
  - "**/tests/**"

  # Vendor and dependencies
  - "**/vendor/**"
  - "vendor/**"

  # Generated files
  - "**/*.pb.go"
  - "**/*_gen.go"
  - "**/*_generated.go"
  - "**/mocks/**"
  - "**/mock_*.go"

  # Build system
  - "**/BUILD.bazel"
  - "**/*.bazel"
  - "MODULE.bazel"
  - "WORKSPACE"
  - ".bazelrc"
  - ".bazelversion"
  - "bazel-*/**"
  - "bazel-bin/**"
  - "bazel-out/**"
  - "bazel-testlogs/**"
  - "bazel-sdk/**"

  # Go modules (analyzed separately)
  - "go.mod"
  - "go.sum"

  # Configuration files
  - ".codacy.yml"
  - ".codacy.yaml"
  - "codacy.yml"
  - "codacy.yaml"
  - ".golangci.yml"
  - ".golangci.yaml"
  - ".prettierrc*"
  - ".prettierignore"
  - "*.config.js"
  - "*.config.json"
  - "*.config.yaml"
  - "*.config.yml"

  # Git and CI
  - ".git/**"
  - "**/.git/**"
  - ".github/**"
  - ".githooks/**"
  - ".gitignore"
  - ".gitattributes"

  # Node/JS files (not relevant for Go project)
  - "node_modules/**"
  - "**/node_modules/**"
  - "package.json"
  - "package-lock.json"
  - "yarn.lock"
  - "*.js"
  - "*.jsx"
  - "*.ts"
  - "*.tsx"

  # Documentation
  - "**/*.md"
  - "docs/**"
  - "LICENSE*"
  - "README*"
  - "CHANGELOG*"
  - "CONTRIBUTING*"

  # IDE files
  - ".vscode/**"
  - ".idea/**"
  - "*.iml"
  - ".claude/**"

  # Makefiles and scripts
  - "Makefile"
  - "makefile"
  - "*.mk"
  - "scripts/**"

# Languages to analyze (focus on Go only)
languages:
  - go

# Tools configuration
tools:
  # Code complexity and maintainability
  - pattern: lizard
    enabled: true
    parameters:
      nloc_threshold: 50
      ccn_threshold: 10
      file_nloc_threshold: 500

  # Security scanning
  - pattern: semgrep
    enabled: true
    parameters:
      config: auto

  # Vulnerability scanning
  - pattern: trivy
    enabled: true
    parameters:
      scan_type: fs
      severity: CRITICAL,HIGH,MEDIUM

  # Shell script analysis
  - pattern: shellcheck
    enabled: true

  # Markdown linting
  - pattern: markdownlint
    enabled: true

  # PMD for additional code analysis
  - pattern: pmd
    enabled: true
