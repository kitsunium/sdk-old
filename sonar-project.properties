# SonarCloud Configuration
sonar.sources=pkg/
sonar.exclusions=**/*_test.go,**/testdata/**,**/*.pb.go,**/BUILD.bazel,**/go.sum,**/go.mod,**/vendor/**,bazel-*/**
sonar.tests=pkg/
sonar.test.inclusions=**/*_test.go

# Language specific settings
sonar.go.file.suffixes=.go

# Exclude only non-production code from coverage analysis
# This allows real coverage metrics while excluding noise
sonar.coverage.exclusions=**/*_test.go,**/*_bench*.go,**/testdata/**,**/*.pb.go,**/vendor/**,**/mocks/**,**/*_gen.go,**/BUILD.bazel,bazel-*/**

# Skip duplicate detection for generated and test files
sonar.cpd.exclusions=**/*.pb.go,**/*_gen.go,**/vendor/**,**/*_test.go

# Enable quality gate to ensure code quality
sonar.qualitygate.wait=true

# Coverage report path (should be generated by CI)
# The CI should run: go test -coverprofile=coverage.out ./...
sonar.go.coverage.reportPaths=coverage.out