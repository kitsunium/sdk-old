# SonarCloud Configuration
sonar.sources=pkg/,cmd/
sonar.exclusions=**/*_test.go,**/testdata/**,**/*.pb.go,**/BUILD.bazel,**/go.sum,**/go.mod
sonar.tests=pkg/,cmd/
sonar.test.inclusions=**/*_test.go
sonar.go.coverage.reportPaths=bazel-out/_coverage/_coverage_report.dat

# Language specific settings
sonar.go.file.suffixes=.go

# Coverage exclusions (test files and generated code)
sonar.coverage.exclusions=**/*_test.go,**/testdata/**,**/*.pb.go,**/mock_*.go