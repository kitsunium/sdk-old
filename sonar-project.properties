# SonarCloud Configuration
sonar.sources=pkg/
sonar.exclusions=**/*_test.go,**/testdata/**,**/*.pb.go,**/BUILD.bazel,**/go.sum,**/go.mod,**/build-wrapper-dump.json,**/*_test.go
sonar.tests=pkg/
sonar.test.inclusions=**/*_test.go
# Use go.coverage.reportPaths for Go coverage
sonar.go.coverage.reportPaths=coverage.lcov

# Language specific settings
sonar.go.file.suffixes=.go

# Coverage exclusions (test files and generated code)
sonar.coverage.exclusions=**/*_test.go,**/testdata/**,**/*.pb.go,**/mock_*.go