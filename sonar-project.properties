# SonarCloud Configuration for Kitsunium SDK

# Source configuration
sonar.sources=pkg/
sonar.exclusions=**/*_test.go,**/testdata/**,**/*.pb.go,**/BUILD.bazel,**/go.sum,**/go.mod,**/vendor/**,bazel-*/**,**/*.bazel
sonar.tests=pkg/
sonar.test.inclusions=**/*_test.go

# Language settings
sonar.go.file.suffixes=.go

# Coverage is disabled - Bazel LCOV format incompatible with SonarCloud
sonar.coverage.exclusions=**/*

# Skip duplicate detection for generated and test files
sonar.cpd.exclusions=**/*.pb.go,**/*_gen.go,**/vendor/**,**/*_test.go,**/BUILD.bazel,**/*.bazel

# Quality Gate
# Do not block PR if quality gate fails
sonar.qualitygate.wait=false