# SonarCloud Configuration for Kitsunium SDK

# Source configuration
sonar.sources=pkg/
sonar.exclusions=**/*_test.go,**/testdata/**,**/*.pb.go,**/BUILD.bazel,**/go.sum,**/go.mod,**/vendor/**,bazel-*/**,**/*.bazel
sonar.tests=pkg/
sonar.test.inclusions=**/*_test.go

# Language settings
sonar.go.file.suffixes=.go

# Coverage configuration
# Exclude test and generated files from coverage analysis
sonar.coverage.exclusions=**/*_test.go,**/*_bench*.go,**/testdata/**,**/*.pb.go,**/vendor/**,**/mocks/**,**/*_gen.go,**/BUILD.bazel,bazel-*/**,**/*.bazel

# Duplication detection
# Skip duplicate detection for generated and test files
sonar.cpd.exclusions=**/*.pb.go,**/*_gen.go,**/vendor/**,**/*_test.go,**/BUILD.bazel,**/*.bazel

# Quality Gate
# Do not block PR if quality gate fails (allows iterative improvement)
sonar.qualitygate.wait=false
