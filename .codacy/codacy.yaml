engines:
  aligncheck:
    enabled: true
  deadcode:
    enabled: true
  gosec:
    enabled: true
  revive:
    enabled: true
  staticcheck:
    enabled: true
exclude_paths:
  - "**/vendor/**"
  - "**/*_test.go"
  - "**/testdata/**"
  - "**/*.pb.go"
  - "**/BUILD.bazel"
  - "**/*.bazel"
  - bazel-*/**
  - ./bazel-*/**
  - bazel-sdk/**
  - bazel-bin/**
  - bazel-out/**
  - bazel-testlogs/**
  - "**/go.mod"
  - "**/go.sum"
  - "**/*_gen.go"
  - "**/mocks/**"
  - "**/*_bench*.go"
  - .github/**
runtimes:
  - go@1.24.6
  - python@3.11.11
tools:
  - lizard@1.17.31
  - semgrep@1.78.0
  - trivy@0.65.0
