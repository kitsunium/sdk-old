name: CI

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Needed for SonarCloud

      - uses: actions/setup-go@v5
        with:
          go-version: 1.24.6
          cache: true

      - uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.4.0
          skip-cache: true

      - name: Validate
        run: |
          go mod verify
          go fmt ./...
          git diff --exit-code || (echo "❌ Files need formatting" && exit 1)

      - name: Test
        run: bazel test //pkg/... --test_output=errors

      - name: Coverage
        if: github.event_name == 'pull_request'
        run: |
          # Generate coverage report using go test for SonarCloud
          go test -v -race -coverprofile=coverage.out -covermode=atomic ./pkg/...
          echo "✅ Coverage report generated at coverage.out"
          echo "Coverage report size: $(wc -c < coverage.out) bytes"

      - name: SonarCloud Scan
        if: github.event_name == 'pull_request'
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ secrets.ORGANIZATION_NAME }}
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
        continue-on-error: true

      - name: Security Scan
        uses: aquasecurity/trivy-action@0.32.0
        if: always()
        with:
          scan-type: fs
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
        continue-on-error: true

      - name: Upload Security Results
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('trivy.sarif') != ''
        with:
          sarif_file: trivy.sarif
