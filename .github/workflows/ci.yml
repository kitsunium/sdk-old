name: CI

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Needed for SonarCloud

      - uses: actions/setup-go@v5
        with:
          go-version: 1.24.6
          cache: true

      - uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.4.0
          skip-cache: true

      - name: Validate
        run: |
          go mod verify
          go fmt ./...
          git diff --exit-code || (echo "❌ Files need formatting" && exit 1)

      - name: Test
        run: bazel test //pkg/... --test_output=errors

      - name: Coverage
        if: github.event_name == 'pull_request'
        run: |
          # Generate LCOV coverage with Bazel
          bazel coverage //pkg/... \
            --combined_report=lcov \
            --instrumentation_filter="//pkg[/:]" \
            --test_output=errors

          # Verify LCOV report exists and copy to root
          if [ -f bazel-out/_coverage/_coverage_report.dat ]; then
            echo "✅ LCOV coverage report generated"
            echo "Coverage report size: $(wc -c < bazel-out/_coverage/_coverage_report.dat) bytes"
            
            # Copy coverage report to root for SonarCloud
            cp bazel-out/_coverage/_coverage_report.dat coverage.lcov
            
            # Debug: Show first few lines to verify format
            echo "First 10 lines of coverage report:"
            head -10 coverage.lcov
          else
            echo "❌ Coverage report not found!"
            exit 1
          fi

      - name: SonarCloud Scan
        if: github.event_name == 'pull_request'
        uses: SonarSource/sonarqube-scan-action@v4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=${{ secrets.ORGANIZATION_NAME }}
            -Dsonar.projectKey=${{ secrets.SONAR_PROJECT_KEY }}
            -Dsonar.pullrequest.key=${{ github.event.pull_request.number }}
            -Dsonar.pullrequest.branch=${{ github.head_ref }}
            -Dsonar.pullrequest.base=${{ github.base_ref }}
        continue-on-error: true

      - name: Security Scan
        uses: aquasecurity/trivy-action@0.32.0
        if: always()
        with:
          scan-type: fs
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
        continue-on-error: true

      - name: Upload Security Results
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('trivy.sarif') != ''
        with:
          sarif_file: trivy.sarif
