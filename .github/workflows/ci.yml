name: CI

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  security-events: write

concurrency:
  # Pour les PRs: groupe par PR number, pour les pushs: groupe par branch/tag
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Annule les workflows en cours sauf sur main et les tags
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

env:
  GO_VERSION: 1.24.6
  BAZEL_VERSION: 7.0.0

jobs:
  # Job 1: Setup and validation
  setup:
    name: 🔧 Setup & Validation
    runs-on: ubuntu-latest
    outputs:
      go-cache-key: ${{ steps.cache-keys.outputs.go-cache }}
      bazel-cache-key: ${{ steps.cache-keys.outputs.bazel-cache }}
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 🔄 Generate cache keys
        id: cache-keys
        run: |
          if [ -n "${GITHUB_OUTPUT:-}" ]; then
            echo "go-cache=${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}" >> $GITHUB_OUTPUT
            echo "bazel-cache=${{ runner.os }}-bazel-${{ hashFiles('**/BUILD.bazel', 'WORKSPACE', 'MODULE.bazel') }}" >> $GITHUB_OUTPUT
          fi

      - name: 🐹 Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: 📦 Verify dependencies
        run: |
          echo "🔍 Verifying Go modules..."
          go mod verify
          go mod download

      - name: 📤 Upload Go modules
        uses: actions/upload-artifact@v4
        with:
          name: go-modules
          path: ~/go/pkg/mod
          retention-days: 1

  # Job 2: Formatting and linting
  lint:
    name: 🎨 Format & Lint
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v5

      - name: 🐹 Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: 📥 Download Go modules
        uses: actions/download-artifact@v4
        with:
          name: go-modules
          path: ~/go/pkg/mod

      - name: 🎨 Check formatting
        run: |
          echo "🔍 Checking Go formatting..."
          # Check if any files would be modified by gofmt
          gofmt -l $(find . -name "*.go" -not -path "./vendor/*" -not -path "./bazel-*/*") > unformatted.txt
          if [ -s unformatted.txt ]; then
            echo "❌ The following files need formatting:"
            cat unformatted.txt
            echo ""
            echo "💡 Run 'make fmt' locally before committing"
            exit 1
          fi
          echo "✅ All files are properly formatted"

      - name: 🔍 Run go vet
        run: |
          echo "🔍 Running go vet..."
          go vet ./...
          echo "✅ No issues found"

      - name: 📤 Upload lint results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-results
          path: |
            *.log
            lint-report.txt
          retention-days: 1
          if-no-files-found: ignore

  # Job 3: Tests (run first to catch regressions early)
  test:
    name: 🧪 Test
    runs-on: ubuntu-latest
    needs: lint
    outputs:
      total_tests: ${{ steps.run-tests.outputs.total_tests }}
      passed_tests: ${{ steps.run-tests.outputs.passed_tests }}
      failed_tests: ${{ steps.run-tests.outputs.failed_tests }}
      flaky_tests: ${{ steps.run-tests.outputs.flaky_tests }}
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v5

      - name: 🐹 Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: 📥 Download Go modules
        uses: actions/download-artifact@v4
        with:
          name: go-modules
          path: ~/go/pkg/mod

      - name: 🏗️ Setup Bazel
        uses: bazel-contrib/setup-bazel@4fd964a13a440a8aeb0be47350db2fc640f19ca8 # v0.15.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      - name: 🧪 Run all tests
        id: run-tests
        run: |
          echo "🧪 Running all unit tests..."
          # Run all tests and capture results
          set +e  # Don't exit immediately on failure
          bazel test //... \
            --test_output=errors \
            --test_size_filters=small,medium \
            --nocache_test_results \
            --test_summary=detailed 2>&1 | tee test-output.txt
          TEST_EXIT_CODE=${PIPESTATUS[0]}
          set -e

          # Extract test statistics from bazel output
          # Bazel output format: "Executed X out of Y tests: Z tests pass."
          TOTAL_TESTS=$(grep -E "^Executed [0-9]+ out of [0-9]+ tests:" test-output.txt | grep -oE "out of [0-9]+" | grep -oE "[0-9]+" || echo "0")
          PASSED_TESTS=$(grep -cE "^//.*[[:space:]]+PASSED" test-output.txt || echo "0")
          FAILED_TESTS=$(grep -cE "^//.*[[:space:]]+FAILED" test-output.txt || echo "0")
          FLAKY_TESTS=$(grep -cE "^//.*[[:space:]]+FLAKY" test-output.txt || echo "0")

          # Save outputs for later use
          # Write to a file to avoid GITHUB_OUTPUT issues
          echo "$TOTAL_TESTS" > /tmp/total_tests
          echo "$PASSED_TESTS" > /tmp/passed_tests
          echo "$FAILED_TESTS" > /tmp/failed_tests
          echo "$FLAKY_TESTS" > /tmp/flaky_tests

          # Try to write to GITHUB_OUTPUT if it exists and is writable
          if [ -n "${GITHUB_OUTPUT:-}" ] && [ -w "${GITHUB_OUTPUT:-/dev/null}" ] 2>/dev/null; then
            echo "total_tests=$TOTAL_TESTS" >> $GITHUB_OUTPUT
            echo "passed_tests=$PASSED_TESTS" >> $GITHUB_OUTPUT
            echo "failed_tests=$FAILED_TESTS" >> $GITHUB_OUTPUT
            echo "flaky_tests=$FLAKY_TESTS" >> $GITHUB_OUTPUT
          fi

          if [ $TEST_EXIT_CODE -ne 0 ]; then
            echo "❌ Some tests failed"
            exit $TEST_EXIT_CODE
          else
            echo "✅ All tests passed"
          fi

      - name: 📊 Generate test report
        if: always()
        run: |
          echo "📊 Extracting test results..."
          # Read from files if outputs are not available
          TOTAL_TESTS="${{ steps.run-tests.outputs.total_tests }}"
          PASSED_TESTS="${{ steps.run-tests.outputs.passed_tests }}"
          FAILED_TESTS="${{ steps.run-tests.outputs.failed_tests }}"
          FLAKY_TESTS="${{ steps.run-tests.outputs.flaky_tests }}"

          # Fallback to reading from temp files if outputs are empty
          if [ -z "$TOTAL_TESTS" ] && [ -f /tmp/total_tests ]; then
            TOTAL_TESTS=$(cat /tmp/total_tests)
          fi
          if [ -z "$PASSED_TESTS" ] && [ -f /tmp/passed_tests ]; then
            PASSED_TESTS=$(cat /tmp/passed_tests)
          fi
          if [ -z "$FAILED_TESTS" ] && [ -f /tmp/failed_tests ]; then
            FAILED_TESTS=$(cat /tmp/failed_tests)
          fi
          if [ -z "$FLAKY_TESTS" ] && [ -f /tmp/flaky_tests ]; then
            FLAKY_TESTS=$(cat /tmp/flaky_tests)
          fi

          # Create test summary file for artifact
          echo "# Test Results Summary" > test-summary.md
          echo "" >> test-summary.md
          echo "| Metric | Count |" >> test-summary.md
          echo "|--------|-------|" >> test-summary.md
          echo "| Total Tests | ${TOTAL_TESTS:-0} |" >> test-summary.md
          echo "| ✅ Passed | ${PASSED_TESTS:-0} |" >> test-summary.md
          echo "| ❌ Failed | ${FAILED_TESTS:-0} |" >> test-summary.md
          echo "| 🔄 Flaky | ${FLAKY_TESTS:-0} |" >> test-summary.md

          # Extract failed tests if any
          if [ "${FAILED_TESTS:-0}" -gt "0" ]; then
            echo "" >> test-summary.md
            echo "## Failed Tests" >> test-summary.md
            echo '```' >> test-summary.md
            grep -E "^//.*\s+FAILED" test-output.txt | head -10 >> test-summary.md || true
            echo '```' >> test-summary.md
          fi

          # Bazel already generates XML test results
          find bazel-testlogs -name "test.xml" -type f > test-files.txt || true
          # Count test results
          echo "Test Summary:" > test-report.txt
          echo "=============" >> test-report.txt
          echo "Total test files: $(wc -l < test-files.txt)" >> test-report.txt

      - name: 📤 Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            bazel-testlogs/**/*.log
            bazel-testlogs/**/*.xml
            test-report.txt
            test-summary.md
            test-output.txt
            test-targets.txt
          retention-days: 1
          if-no-files-found: ignore

  # Job 4: Build (only after tests pass)
  build:
    name: 🔨 Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v5

      - name: 🐹 Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: 📥 Download Go modules
        uses: actions/download-artifact@v4
        with:
          name: go-modules
          path: ~/go/pkg/mod

      - name: 🏗️ Setup Bazel
        uses: bazel-contrib/setup-bazel@4fd964a13a440a8aeb0be47350db2fc640f19ca8 # v0.15.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      - name: 🔨 Build all targets
        run: |
          echo "🔨 Building all targets..."
          # Build everything in the repository
          bazel build //...
          echo "✅ Build successful"

      - name: 📤 Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            bazel-bin/**/*.a
            bazel-bin/**/*.so
            bazel-bin/**/*.tar
          retention-days: 1
          if-no-files-found: ignore

  # Job 5: Coverage
  coverage:
    name: 📊 Coverage
    runs-on: ubuntu-latest
    needs: test
    if: always()
    outputs:
      percentage: ${{ steps.calc-coverage.outputs.percentage }}
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v5

      - name: 🐹 Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: 📥 Download Go modules
        uses: actions/download-artifact@v4
        with:
          name: go-modules
          path: ~/go/pkg/mod

      - name: 🏗️ Setup Bazel
        uses: bazel-contrib/setup-bazel@4fd964a13a440a8aeb0be47350db2fc640f19ca8 # v0.15.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      - name: 📊 Generate coverage report
        id: calc-coverage
        run: |
          echo "📊 Generating LCOV coverage with Bazel..."
          # Generate coverage with LCOV format
          bazel coverage //... \
            --combined_report=lcov \
            --coverage_report_generator=@bazel_tools//tools/test:lcov_merger \
            --test_size_filters=small,medium \
            --instrumentation_filter="//pkg[/:],//cmd[/:]" || true

          # Bazel puts the LCOV report in a specific location
          COVERAGE_FILE="bazel-out/_coverage/_coverage_report.dat"
          if [ -f "$COVERAGE_FILE" ]; then
            echo "✅ Coverage report found at $COVERAGE_FILE"
            cp "$COVERAGE_FILE" coverage.lcov
            # Fix paths and remove external dependencies
            sed -i.bak 's|SF:.*/sdk/|SF:|g' coverage.lcov
            # Remove coverage for external dependencies (like gazelle)
            sed -i.bak '/^SF:external\//,/^end_of_record$/d' coverage.lcov
            echo "📈 LCOV coverage report ready"
            echo "Coverage lines: $(wc -l < coverage.lcov)"
            
            # Calculate coverage percentage from LCOV
            if [ -s coverage.lcov ]; then
              LINES_FOUND=$(grep -o '^LF:[0-9]*' coverage.lcov | cut -d: -f2 | awk '{sum += $1} END {print sum}')
              LINES_HIT=$(grep -o '^LH:[0-9]*' coverage.lcov | cut -d: -f2 | awk '{sum += $1} END {print sum}')
              if [ -n "$LINES_FOUND" ] && [ "$LINES_FOUND" -gt 0 ]; then
                COVERAGE_PCT=$(awk "BEGIN {printf \"%.1f\", ($LINES_HIT / $LINES_FOUND) * 100}")
                if [ -n "${GITHUB_OUTPUT:-}" ]; then
                  echo "percentage=$COVERAGE_PCT" >> $GITHUB_OUTPUT
                fi
                echo "📊 Coverage: ${COVERAGE_PCT}%"
              else
                if [ -n "${GITHUB_OUTPUT:-}" ]; then
                  echo "percentage=0.0" >> $GITHUB_OUTPUT
                fi
              fi
            else
              if [ -n "${GITHUB_OUTPUT:-}" ]; then
                echo "percentage=0.0" >> $GITHUB_OUTPUT
              fi
            fi
          else
            echo "⚠️ No coverage report generated"
            touch coverage.lcov
            if [ -n "${GITHUB_OUTPUT:-}" ]; then
              echo "percentage=0.0" >> $GITHUB_OUTPUT
            fi
          fi

      - name: 📤 Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.lcov
          retention-days: 1

      - name: 📊 Upload coverage to Codacy
        uses: codacy/codacy-coverage-reporter-action@89d6c85cfafaec52c72b6c5e8b2878d33104c699 # v1.3.0
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: coverage.lcov
        continue-on-error: true

  # Job 6: Benchmarks (only on main after merge)
  benchmarks:
    name: ⚡ Collect Benchmarks
    runs-on: ubuntu-latest
    needs: [test, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐹 Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: 🏗️ Setup Bazel
        uses: bazel-contrib/setup-bazel@4fd964a13a440a8aeb0be47350db2fc640f19ca8 # v0.15.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: 🔧 Configure Git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: 📊 Update and save benchmarks
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "📊 Updating benchmark database from BENCH tag..."
          make bench/update || echo "No existing BENCH tag found"

          echo "⚡ Running benchmarks..."
          make bench/save

          # Check if benchmarks.sqlite exists
          if [ ! -f benchmarks.sqlite ]; then
            echo "❌ No benchmarks.sqlite file found"
            exit 1
          fi

          echo "✅ Benchmarks database ready"

      - name: 🏷️ Update BENCH tag
        run: |
          # Delete the existing BENCH tag if it exists (both locally and remotely)
          git tag -d BENCH 2>/dev/null || true
          git push origin :refs/tags/BENCH 2>/dev/null || true

          # Create new BENCH tag at current commit
          git tag BENCH
          git push origin BENCH

      - name: 🚀 Create/Update BENCH Release
        uses: ncipollo/release-action@2c591bcc8ecdcd2db72b97d6147f871fcd833ba5 # v1.14.0
        with:
          allowUpdates: true
          artifacts: "benchmarks.sqlite"
          body: |
            ## 📊 Benchmark Database

            This release contains the cumulative benchmark database for the SDK.

            **Last updated**: ${{ github.event.head_commit.timestamp }}
            **Commit**: ${{ github.sha }}

            ### Usage
            ```bash
            # Download benchmark database
            make bench/update

            # Compare benchmarks
            make bench/compare
            ```
          name: "Benchmark Database"
          tag: "BENCH"
          commit: ${{ github.sha }}
          makeLatest: false
          prerelease: true
          replacesArtifacts: true
          token: ${{ secrets.GITHUB_TOKEN }}

  # Job 7: Final status check
  status:
    name: ✅ CI Status
    runs-on: ubuntu-latest
    needs: [lint, test, build, coverage]
    if: always()
    steps:
      - name: 📥 Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 📊 Generate summary
        run: |
          echo "# 📊 CI Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Check job statuses
          echo "## Job Results" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.lint.result }}" = "success" ]; then
            echo "| 🎨 Lint | ✅ Success |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| 🎨 Lint | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.test.result }}" = "success" ]; then
            TOTAL="${{ needs.test.outputs.total_tests }}"
            PASSED="${{ needs.test.outputs.passed_tests }}"
            if [ -n "$TOTAL" ] && [ "$TOTAL" != "0" ]; then
              echo "| 🧪 Test | ✅ Success ($PASSED/$TOTAL passed) |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| 🧪 Test | ✅ Success |" >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo "| 🧪 Test | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.build.result }}" = "success" ]; then
            echo "| 🔨 Build | ✅ Success |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| 🔨 Build | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.coverage.result }}" = "success" ]; then
            COVERAGE_PCT="${{ needs.coverage.outputs.percentage }}"
            if [ -n "$COVERAGE_PCT" ] && [ "$COVERAGE_PCT" != "0.0" ]; then
              echo "| 📊 Coverage | ✅ Success (${COVERAGE_PCT}%) |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| 📊 Coverage | ✅ Success |" >> $GITHUB_STEP_SUMMARY
            fi
          elif [ "${{ needs.coverage.result }}" = "skipped" ]; then
            echo "| 📊 Coverage | ⏭️ Skipped (not a PR) |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| 📊 Coverage | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY

          # Add test details if available
          if [ "${{ needs.test.result }}" = "success" ]; then
            TOTAL="${{ needs.test.outputs.total_tests }}"
            PASSED="${{ needs.test.outputs.passed_tests }}"
            FAILED="${{ needs.test.outputs.failed_tests }}"
            FLAKY="${{ needs.test.outputs.flaky_tests }}"
            
            if [ -n "$TOTAL" ] && [ "$TOTAL" != "0" ]; then
              echo "## 🧪 Test Results" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "| Metric | Count |" >> $GITHUB_STEP_SUMMARY
              echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
              echo "| Total Tests | $TOTAL |" >> $GITHUB_STEP_SUMMARY
              echo "| ✅ Passed | $PASSED |" >> $GITHUB_STEP_SUMMARY
              if [ -n "$FAILED" ] && [ "$FAILED" != "0" ]; then
                echo "| ❌ Failed | $FAILED |" >> $GITHUB_STEP_SUMMARY
              fi
              if [ -n "$FLAKY" ] && [ "$FLAKY" != "0" ]; then
                echo "| 🔄 Flaky | $FLAKY |" >> $GITHUB_STEP_SUMMARY
              fi
              echo "" >> $GITHUB_STEP_SUMMARY
            fi
          fi

          # Add coverage details if available
          if [ "${{ needs.coverage.result }}" = "success" ]; then
            COVERAGE_PCT="${{ needs.coverage.outputs.percentage }}"
            if [ -n "$COVERAGE_PCT" ] && [ "$COVERAGE_PCT" != "0.0" ]; then
              echo "## 📊 Code Coverage" >> $GITHUB_STEP_SUMMARY
              echo "**Overall Coverage: ${COVERAGE_PCT}%**" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
            fi
          fi

          echo "## 📦 Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "The following artifacts were generated:" >> $GITHUB_STEP_SUMMARY
          echo "- Test results" >> $GITHUB_STEP_SUMMARY
          echo "- Coverage reports" >> $GITHUB_STEP_SUMMARY
          echo "- Lint results" >> $GITHUB_STEP_SUMMARY

      - name: ✅ Check overall status
        if: |
          needs.lint.result != 'success' ||
          needs.test.result != 'success' ||
          needs.build.result != 'success'
        run: |
          echo "❌ CI pipeline failed"
          exit 1
