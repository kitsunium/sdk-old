name: CI

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  security-events: write

concurrency:
  # Pour les PRs: groupe par PR number, pour les pushs: groupe par branch/tag
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Annule les workflows en cours sauf sur main et les tags
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

env:
  GO_VERSION: 1.24.6
  BAZEL_VERSION: 7.0.0

jobs:
  # Job 1: Setup and validation
  setup:
    name: 🔧 Setup & Validation
    runs-on: ubuntu-latest
    outputs:
      go-cache-key: ${{ steps.cache-keys.outputs.go-cache }}
      bazel-cache-key: ${{ steps.cache-keys.outputs.bazel-cache }}
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 🔄 Generate cache keys
        id: cache-keys
        run: |
          echo "go-cache=${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}" >> $GITHUB_OUTPUT
          echo "bazel-cache=${{ runner.os }}-bazel-${{ hashFiles('**/BUILD.bazel', 'WORKSPACE', 'MODULE.bazel') }}" >> $GITHUB_OUTPUT

      - name: 🐹 Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: 📦 Verify dependencies
        run: |
          echo "🔍 Verifying Go modules..."
          go mod verify
          go mod download

      - name: 📤 Upload Go modules
        uses: actions/upload-artifact@v4
        with:
          name: go-modules
          path: ~/go/pkg/mod
          retention-days: 1

  # Job 2: Formatting and linting
  lint:
    name: 🎨 Format & Lint
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v5

      - name: 🐹 Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: 📥 Download Go modules
        uses: actions/download-artifact@v4
        with:
          name: go-modules
          path: ~/go/pkg/mod

      - name: 🎨 Check formatting
        run: |
          echo "🔍 Checking Go formatting..."
          unformatted=$(go fmt ./...)
          if [ -n "$unformatted" ]; then
            echo "❌ Files need formatting:"
            echo "$unformatted"
            exit 1
          fi
          echo "✅ All files are properly formatted"

      - name: 🔍 Run go vet
        run: |
          echo "🔍 Running go vet..."
          go vet ./...
          echo "✅ No issues found"

      - name: 📤 Upload lint results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-results
          path: |
            *.log
            lint-report.txt
          retention-days: 1
          if-no-files-found: ignore

  # Job 3: Tests (run first to catch regressions early)
  test:
    name: 🧪 Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v5

      - name: 🐹 Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: 📥 Download Go modules
        uses: actions/download-artifact@v4
        with:
          name: go-modules
          path: ~/go/pkg/mod

      - name: 🏗️ Setup Bazel
        uses: bazel-contrib/setup-bazel@4fd964a13a440a8aeb0be47350db2fc640f19ca8 # v0.15.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      - name: 🧪 Run all tests
        run: |
          echo "🧪 Running all unit tests..."
          # Run all tests with coverage
          bazel test //... \
            --test_output=errors \
            --test_size_filters=small,medium \
            --nocache_test_results
          echo "✅ All tests passed"

      - name: 📊 Generate test report
        if: always()
        run: |
          echo "📊 Extracting test results..."
          # Bazel already generates XML test results
          find bazel-testlogs -name "test.xml" -type f > test-files.txt || true
          # Count test results
          echo "Test Summary:" > test-report.txt
          echo "=============" >> test-report.txt
          echo "Total test files: $(wc -l < test-files.txt)" >> test-report.txt

      - name: 📤 Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            bazel-testlogs/**/*.log
            bazel-testlogs/**/*.xml
            test-report.txt
            test-targets.txt
          retention-days: 1
          if-no-files-found: ignore

  # Job 4: Build (only after tests pass)
  build:
    name: 🔨 Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v5

      - name: 🐹 Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: 📥 Download Go modules
        uses: actions/download-artifact@v4
        with:
          name: go-modules
          path: ~/go/pkg/mod

      - name: 🏗️ Setup Bazel
        uses: bazel-contrib/setup-bazel@4fd964a13a440a8aeb0be47350db2fc640f19ca8 # v0.15.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      - name: 🔨 Build all targets
        run: |
          echo "🔨 Building all targets..."
          # Build everything in the repository
          bazel build //...
          echo "✅ Build successful"

      - name: 📤 Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            bazel-bin/**/*.a
            bazel-bin/**/*.so
            bazel-bin/**/*.tar
          retention-days: 1
          if-no-files-found: ignore

  # Job 5: Coverage
  coverage:
    name: 📊 Coverage
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v5

      - name: 🐹 Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: 📥 Download Go modules
        uses: actions/download-artifact@v4
        with:
          name: go-modules
          path: ~/go/pkg/mod

      - name: 🏗️ Setup Bazel
        uses: bazel-contrib/setup-bazel@4fd964a13a440a8aeb0be47350db2fc640f19ca8 # v0.15.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      - name: 📊 Generate coverage report
        run: |
          echo "📊 Generating LCOV coverage with Bazel..."
          # Generate coverage with LCOV format for Codacy
          bazel coverage //... \
            --combined_report=lcov \
            --coverage_report_generator=@bazel_tools//tools/test:lcov_merger \
            --test_size_filters=small,medium \
            --instrumentation_filter="//pkg[/:],//cmd[/:]" || true

          # Bazel puts the LCOV report in a specific location
          COVERAGE_FILE="bazel-out/_coverage/_coverage_report.dat"
          if [ -f "$COVERAGE_FILE" ]; then
            echo "✅ Coverage report found at $COVERAGE_FILE"
            cp "$COVERAGE_FILE" coverage.lcov
            # Fix paths for Codacy
            sed -i.bak 's|SF:.*/sdk/|SF:|g' coverage.lcov
            echo "📈 LCOV coverage report ready for Codacy"
            echo "Coverage lines: $(wc -l < coverage.lcov)"
          else
            echo "⚠️ No coverage report generated"
            touch coverage.lcov
          fi

      - name: 📤 Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.lcov
          retention-days: 1

  # Job 6: Security scanning
  security:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v5

      - name: 🐹 Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: 🔒 Run gosec
        run: |
          echo "🔒 Installing gosec..."
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          echo "🔍 Running security scan..."
          ~/go/bin/gosec -fmt json -out gosec-report.json ./... || true
          ~/go/bin/gosec ./... || true

      - name: 📤 Upload security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: gosec-report.json
          retention-days: 1

  # Job 7: Codacy analysis
  codacy:
    name: 📈 Codacy Analysis
    runs-on: ubuntu-latest
    needs: [test, coverage]
    if: github.event_name == 'pull_request'
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 📥 Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: .

      - name: 📈 Run Codacy analysis
        uses: codacy/codacy-analysis-cli-action@562ee3e92b8e92df8b67e0a5ff8aa8e261919c08 # v4.4.7
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN || '' }}
          upload: true
        continue-on-error: true

      - name: 📊 Upload coverage to Codacy
        if: hashFiles('coverage.lcov') != ''
        env:
          CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
        run: |
          if [ -n "$CODACY_PROJECT_TOKEN" ]; then
            echo "📊 Uploading coverage to Codacy..."
            bash <(curl -Ls https://coverage.codacy.com/get.sh) report \
              -r coverage.lcov \
              -t $CODACY_PROJECT_TOKEN \
              --partial
          else
            echo "⚠️ CODACY_PROJECT_TOKEN not set, skipping coverage upload"
          fi
        continue-on-error: true

  # Job 8: Codacy Security Scan
  codacy-security-scan:
    name: 🔐 Codacy Security Scan
    runs-on: ubuntu-latest
    needs: [security, test]
    permissions:
      security-events: write
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v5

      - name: 🔍 Run Codacy Analysis CLI
        uses: codacy/codacy-analysis-cli-action@562ee3e92b8e92df8b67e0a5ff8aa8e261919c08 # v4.4.7
        with:
          output: results.sarif
          format: sarif
          # Adjust severity of non-security issues
          gh-code-scanning-compat: true
          # Force 0 exit code to allow SARIF file generation
          # This will hand over control about PR rejection to the GitHub side
          max-allowed-issues: 2147483647

      # Upload the SARIF file generated in the previous step
      - name: 📤 Upload SARIF results file
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: results.sarif
          category: codacy-security

  # Job 9: Benchmarks
  benchmark:
    name: ⚡ Benchmarks
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v5

      - name: 🐹 Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: 📥 Download Go modules
        uses: actions/download-artifact@v4
        with:
          name: go-modules
          path: ~/go/pkg/mod

      - name: 🏗️ Setup Bazel
        uses: bazel-contrib/setup-bazel@4fd964a13a440a8aeb0be47350db2fc640f19ca8 # v0.15.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      - name: ⚡ Run benchmarks
        run: |
          echo "⚡ Running benchmarks..."
          # Run all tests with benchmark flag
          # Tests tagged with 'bench' or containing Benchmark functions
          bazel test //... \
            --test_arg=-test.bench=. \
            --test_arg=-test.benchmem \
            --test_arg=-test.benchtime=2s \
            --test_arg=-test.run=^$ \
            --test_output=streamed \
            --test_size_filters=small,medium,large \
            --nocache_test_results 2>&1 | tee benchmark-results.txt || true

          # Extract benchmark results
          echo "" >> benchmark-results.txt
          echo "=== Benchmark Summary ===" >> benchmark-results.txt
          grep -E "^Benchmark|^goos:|^goarch:|ns/op|B/op|allocs/op" benchmark-results.txt > benchmark-summary.txt || true

          if [ -s benchmark-summary.txt ]; then
            cat benchmark-summary.txt >> benchmark-results.txt
          else
            echo "No benchmark results found" >> benchmark-results.txt
          fi

      - name: 📤 Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark-results.txt
          retention-days: 1
          if-no-files-found: ignore

  # Job 9: Final status check
  status:
    name: ✅ CI Status
    runs-on: ubuntu-latest
    needs: [lint, test, build, security, coverage]
    if: always()
    steps:
      - name: 📥 Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 📊 Generate summary
        run: |
          echo "# 📊 CI Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Check job statuses
          echo "## Job Results" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.lint.result }}" = "success" ]; then
            echo "| 🎨 Lint | ✅ Success |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| 🎨 Lint | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.test.result }}" = "success" ]; then
            echo "| 🧪 Test | ✅ Success |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| 🧪 Test | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.build.result }}" = "success" ]; then
            echo "| 🔨 Build | ✅ Success |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| 🔨 Build | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.security.result }}" = "success" ]; then
            echo "| 🔒 Security | ✅ Success |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| 🔒 Security | ⚠️ Issues found |" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.coverage.result }}" = "success" ]; then
            echo "| 📊 Coverage | ✅ Success |" >> $GITHUB_STEP_SUMMARY
          elif [ "${{ needs.coverage.result }}" = "skipped" ]; then
            echo "| 📊 Coverage | ⏭️ Skipped (not a PR) |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| 📊 Coverage | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 📦 Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "The following artifacts were generated:" >> $GITHUB_STEP_SUMMARY
          echo "- Test results" >> $GITHUB_STEP_SUMMARY
          echo "- Coverage reports" >> $GITHUB_STEP_SUMMARY
          echo "- Security scan results" >> $GITHUB_STEP_SUMMARY
          echo "- Benchmark results (PR only)" >> $GITHUB_STEP_SUMMARY

      - name: ✅ Check overall status
        if: |
          needs.lint.result != 'success' ||
          needs.test.result != 'success' ||
          needs.coverage.result != 'success'
        run: |
          echo "❌ CI pipeline failed"
          exit 1
