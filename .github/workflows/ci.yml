name: CI

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: 1.24.6
  BAZEL_VERSION: 7.0.0

jobs:
  # Job 1: Setup and validation
  setup:
    name: 🔧 Setup & Validation
    runs-on: ubuntu-latest
    outputs:
      go-cache-key: ${{ steps.cache-keys.outputs.go-cache }}
      bazel-cache-key: ${{ steps.cache-keys.outputs.bazel-cache }}
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 🔄 Generate cache keys
        id: cache-keys
        run: |
          echo "go-cache=${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}" >> $GITHUB_OUTPUT
          echo "bazel-cache=${{ runner.os }}-bazel-${{ hashFiles('**/BUILD.bazel', 'WORKSPACE', 'MODULE.bazel') }}" >> $GITHUB_OUTPUT

      - name: 🐹 Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: 📦 Verify dependencies
        run: |
          echo "🔍 Verifying Go modules..."
          go mod verify
          go mod download

      - name: 📤 Upload Go modules
        uses: actions/upload-artifact@v4
        with:
          name: go-modules
          path: ~/go/pkg/mod
          retention-days: 1

  # Job 2: Formatting and linting
  lint:
    name: 🎨 Format & Lint
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v5

      - name: 🐹 Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: 📥 Download Go modules
        uses: actions/download-artifact@v4
        with:
          name: go-modules
          path: ~/go/pkg/mod

      - name: 🎨 Check formatting
        run: |
          echo "🔍 Checking Go formatting..."
          unformatted=$(go fmt ./...)
          if [ -n "$unformatted" ]; then
            echo "❌ Files need formatting:"
            echo "$unformatted"
            exit 1
          fi
          echo "✅ All files are properly formatted"

      - name: 🔍 Run go vet
        run: |
          echo "🔍 Running go vet..."
          go vet ./...
          echo "✅ No issues found"

      - name: 📤 Upload lint results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-results
          path: |
            *.log
            lint-report.txt
          retention-days: 7
          if-no-files-found: ignore

  # Job 3: Build
  build:
    name: 🔨 Build
    runs-on: ubuntu-latest
    needs: setup
    strategy:
      matrix:
        target: [
          "//pkg/core/...",
          "//pkg/kernel/...",
          "//pkg/lib/..."
        ]
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v5

      - name: 🐹 Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: 📥 Download Go modules
        uses: actions/download-artifact@v4
        with:
          name: go-modules
          path: ~/go/pkg/mod

      - name: 🏗️ Setup Bazel
        uses: bazel-contrib/setup-bazel@4fd964a13a440a8aeb0be47350db2fc640f19ca8 # v0.15.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      - name: 🔨 Build target ${{ matrix.target }}
        run: |
          echo "🔨 Building ${{ matrix.target }}..."
          bazel build ${{ matrix.target }}
          echo "✅ Build successful"

      - name: 📤 Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts-${{ strategy.job-index }}
          path: |
            bazel-bin/**/*.a
            bazel-bin/**/*.so
          retention-days: 1
          if-no-files-found: ignore

  # Job 4: Tests
  test:
    name: 🧪 Test
    runs-on: ubuntu-latest
    needs: [lint, build]
    strategy:
      matrix:
        package: [
          "config",
          "kernel",
          "lib"
        ]
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v5

      - name: 🐹 Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: 📥 Download Go modules
        uses: actions/download-artifact@v4
        with:
          name: go-modules
          path: ~/go/pkg/mod

      - name: 🏗️ Setup Bazel
        uses: bazel-contrib/setup-bazel@4fd964a13a440a8aeb0be47350db2fc640f19ca8 # v0.15.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      - name: 🧪 Run tests for ${{ matrix.package }}
        run: |
          echo "🧪 Testing pkg/${{ matrix.package }}..."
          if [ "${{ matrix.package }}" = "config" ]; then
            bazel test //pkg/core/config/... //pkg/kernel/config/... --test_output=errors
          else
            bazel test //pkg/${{ matrix.package }}/... --test_output=errors
          fi
          echo "✅ Tests passed"

      - name: 📊 Generate test report
        if: always()
        run: |
          echo "📊 Generating test report..."
          bazel query "tests(//pkg/${{ matrix.package }}/...)" 2>/dev/null | head -20 > test-report-${{ matrix.package }}.txt || true

      - name: 📤 Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.package }}
          path: |
            bazel-testlogs/**/*.log
            bazel-testlogs/**/*.xml
            test-report-${{ matrix.package }}.txt
          retention-days: 7
          if-no-files-found: ignore

  # Job 5: Coverage
  coverage:
    name: 📊 Coverage
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'pull_request'
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v5

      - name: 🐹 Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: 📥 Download Go modules
        uses: actions/download-artifact@v4
        with:
          name: go-modules
          path: ~/go/pkg/mod

      - name: 🏗️ Setup Bazel
        uses: bazel-contrib/setup-bazel@4fd964a13a440a8aeb0be47350db2fc640f19ca8 # v0.15.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      - name: 📊 Generate coverage report
        run: |
          echo "📊 Generating coverage with Bazel..."
          bazel coverage --combined_report=lcov //pkg/... || true
          
          if [ -f bazel-out/_coverage/_coverage_report.dat ]; then
            echo "✅ Coverage report found"
            cp bazel-out/_coverage/_coverage_report.dat coverage.lcov
            sed -i.bak 's|SF:.*/sdk/|SF:|g' coverage.lcov
            echo "📈 Coverage report ready"
          else
            echo "⚠️ No coverage report generated"
            echo "" > coverage.lcov
          fi

      - name: 📤 Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.lcov
          retention-days: 7

  # Job 6: Security scanning
  security:
    name: 🔒 Security Scan
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v5

      - name: 🐹 Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: 🔒 Run gosec
        run: |
          echo "🔒 Installing gosec..."
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          echo "🔍 Running security scan..."
          ~/go/bin/gosec -fmt json -out gosec-report.json ./... || true
          ~/go/bin/gosec ./... || true

      - name: 📤 Upload security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: gosec-report.json
          retention-days: 30

  # Job 7: Codacy analysis
  codacy:
    name: 📈 Codacy Analysis
    runs-on: ubuntu-latest
    needs: [test, coverage]
    if: github.event_name == 'pull_request'
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: 📥 Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: .

      - name: 📈 Run Codacy analysis
        uses: codacy/codacy-analysis-cli-action@562ee3e92b8e92df8b67e0a5ff8aa8e261919c08 # v4.4.7
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN || '' }}
          verbose: true
          upload: true
          max-allowed-issues: 2147483647
        continue-on-error: true

      - name: 📊 Upload coverage to Codacy
        if: hashFiles('coverage.lcov') != ''
        env:
          CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
        run: |
          if [ -n "$CODACY_PROJECT_TOKEN" ]; then
            echo "📊 Uploading coverage to Codacy..."
            bash <(curl -Ls https://coverage.codacy.com/get.sh) report \
              -r coverage.lcov \
              -t $CODACY_PROJECT_TOKEN \
              --partial
          else
            echo "⚠️ CODACY_PROJECT_TOKEN not set, skipping coverage upload"
          fi
        continue-on-error: true

  # Job 8: Benchmarks
  benchmark:
    name: ⚡ Benchmarks
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v5

      - name: 🐹 Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: 📥 Download Go modules
        uses: actions/download-artifact@v4
        with:
          name: go-modules
          path: ~/go/pkg/mod

      - name: 🏗️ Setup Bazel
        uses: bazel-contrib/setup-bazel@4fd964a13a440a8aeb0be47350db2fc640f19ca8 # v0.15.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      - name: ⚡ Run benchmarks
        run: |
          echo "⚡ Running benchmarks..."
          for target in $(bazel query 'attr(tags, "bench", //pkg/...)' 2>/dev/null | head -5); do
            echo "Running benchmark: $target"
            bazel run $target --test_output=streamed -- -test.bench=. -test.benchmem -test.benchtime=1s 2>&1 | tee -a benchmark-results.txt || true
          done

      - name: 📤 Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark-results.txt
          retention-days: 30
          if-no-files-found: ignore

  # Job 9: Final status check
  status:
    name: ✅ CI Status
    runs-on: ubuntu-latest
    needs: [lint, test, security]
    if: always()
    steps:
      - name: 📥 Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: 📊 Generate summary
        run: |
          echo "# 📊 CI Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Check job statuses
          echo "## Job Results" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          
          if [ "${{ needs.lint.result }}" = "success" ]; then
            echo "| 🎨 Lint | ✅ Success |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| 🎨 Lint | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ needs.test.result }}" = "success" ]; then
            echo "| 🧪 Test | ✅ Success |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| 🧪 Test | ❌ Failed |" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ needs.security.result }}" = "success" ]; then
            echo "| 🔒 Security | ✅ Success |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| 🔒 Security | ⚠️ Issues found |" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## 📦 Artifacts" >> $GITHUB_STEP_SUMMARY
          echo "The following artifacts were generated:" >> $GITHUB_STEP_SUMMARY
          echo "- Test results" >> $GITHUB_STEP_SUMMARY
          echo "- Coverage reports" >> $GITHUB_STEP_SUMMARY
          echo "- Security scan results" >> $GITHUB_STEP_SUMMARY
          echo "- Benchmark results (PR only)" >> $GITHUB_STEP_SUMMARY

      - name: ✅ Check overall status
        if: |
          needs.lint.result != 'success' ||
          needs.test.result != 'success'
        run: |
          echo "❌ CI pipeline failed"
          exit 1