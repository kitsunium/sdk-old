name: CI

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  security-events: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Needed for SonarCloud

      - uses: actions/setup-go@v5
        with:
          go-version: 1.24.6
          cache: true

      - uses: bazel-contrib/setup-bazel@0.15.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.4.0
          skip-cache: true

      - name: Validate
        run: |
          go mod verify
          go fmt ./...
          git diff --exit-code || (echo "❌ Files need formatting" && exit 1)

      - name: Test
        run: bazel test //pkg/... --test_output=errors

      - name: Coverage
        if: github.event_name == 'pull_request'
        run: |
          echo "📊 Generating coverage with Bazel..."
          # Generate coverage with Bazel
          bazel coverage --combined_report=lcov //pkg/... || true

          # Copy coverage report if it exists
          if [ -f bazel-out/_coverage/_coverage_report.dat ]; then
            echo "✅ Coverage report found, preparing for Codacy..."
            cp bazel-out/_coverage/_coverage_report.dat coverage.lcov
            
            # Convert absolute paths to relative for better compatibility
            sed -i.bak 's|SF:.*/sdk/|SF:|g' coverage.lcov
            
            echo "📈 Coverage report ready (LCOV format)"
          else
            echo "⚠️ No coverage report generated"
          fi

      - name: Codacy Analysis
        if: github.event_name == 'pull_request'
        uses: codacy/codacy-analysis-cli-action@v4.5.0
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN || '' }}
          verbose: true
          upload: true
          max-allowed-issues: 2147483647
        continue-on-error: true
      
      - name: Upload Coverage to Codacy
        if: github.event_name == 'pull_request' && hashFiles('coverage.lcov') != ''
        env:
          CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
        run: |
          if [ -n "$CODACY_PROJECT_TOKEN" ]; then
            echo "📊 Uploading coverage to Codacy..."
            bash <(curl -Ls https://coverage.codacy.com/get.sh) report \
              -r coverage.lcov \
              -t $CODACY_PROJECT_TOKEN \
              --partial
          else
            echo "⚠️ CODACY_PROJECT_TOKEN not set, skipping coverage upload"
          fi
        continue-on-error: true

      - name: Security Scan
        uses: aquasecurity/trivy-action@0.32.0
        if: always()
        with:
          scan-type: fs
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
        continue-on-error: true

      - name: Upload Security Results
        uses: github/codeql-action/upload-sarif@v3
        if: always() && hashFiles('trivy.sarif') != ''
        with:
          sarif_file: trivy.sarif
